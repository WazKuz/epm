<!DOCTYPE html>
<html>
<head>
<title>EPM</title>

<style>
body {
    font-family: sans-serif;
    font-size: 12px;
    background: ButtonFace;
    color: ButtonText;
    margin: 10px;
}

.window {
    width: 280px;
    border: 1px solid ButtonShadow;
    padding: 8px;
    background: ButtonFace;
}

.title {
    font-weight: bold;
    margin-bottom: 6px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 2px;
    vertical-align: middle;
}

.label {
    width: 70px;
}

input {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 12px;
}

.buttons {
    margin-top: 8px;
    text-align: right;
}

button {
    font-family: inherit;
    font-size: 12px;
    margin-left: 4px;
}
</style>

</head>

<body>

<div class="window">

<div class="title">EPM v1.02</div>

<table>
<tr>
    <td class="label">DEBUG</td>
    <td><input id="debug" value="---" readonly></td>
</tr>
</table>

<div class="buttons">
    <button onclick="toggleExit()">Exit</button>
    <button onclick="refresh()">Refresh</button>
</div>

</div>

<script>
let running = true;

function checkServices(){
    let services = {
        online: navigator.onLine,
        storage: !!window.localStorage,
        timing: !!window.performance,
        visibility: document.visibilityState === "visible",
        cookies: navigator.cookieEnabled
    };

    return services;
}

function generateDebug(services){
    let values = Object.values(services).map(v => v ? 1 : 0).join("");
    let num = parseInt(values, 2) || 0;
    return (100 + num).toString().slice(0,3);
}

function updateDebug(){
    let services = checkServices();

    document.getElementById("debug").value =
        generateDebug(services);
}

function toggleExit(){
    running = !running;

    if(!running){
        document.getElementById("debug").value = "---";
    } else {
        updateDebug();
    }
}

function refresh(){
    updateDebug();
}

document.addEventListener("keydown", function(e){
    if(e.key === "1") toggleExit();
    if(e.key === "2") refresh();
});

setInterval(function(){
    if(running){
        updateDebug();
    }
}, 1000);

updateDebug();
</script>

</body>
</html>
